services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dishframe
    ports:
      - "5432:5432"
    volumes:
      - dishframe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dishframe"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  dishframe-postgres:
