<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · DishFrame</title>
    <meta name="theme-color" content="#2563eb" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --fg: #1c2230;
        --muted: #5b6472;
        --accent: #2563eb;
        --card: #ffffff;
        --border: #e2e5ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171c;
          --fg: #eef1f5;
          --muted: #9aa3b2;
          --accent: #6d9bff;
          --card: #1c2028;
          --border: #2a2f38;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: none;
        background: var(--accent);
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
      }
      .icon {
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📴</div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Recipes, Parts, and
        Cooking Mode sessions you've already opened are still available from
        the app's home screen — try going back or reopening DishFrame.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
