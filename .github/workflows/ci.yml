name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BETTER_AUTH_SECRET: ci-placeholder-secret-do-not-use-in-production
  BETTER_AUTH_URL: http://localhost:3000
  SHARE_LINK_HMAC_SECRET: ci-placeholder-share-secret-do-not-use-in-production
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Disposable service-container Postgres — never the real Neon database.
  # See src/lib/db/adapter.ts and docker-compose.yml for the local-dev equivalent.
  # No SHADOW_DATABASE_URL: `prisma migrate deploy` (used below) never needs
  # a shadow database — only `migrate dev`/`migrate reset` do.
  DATABASE_DRIVER: pg
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dishframe

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dishframe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dishframe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Migration safety scan
        run: pnpm run db:scan-migrations

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify protected database objects
        run: pnpm exec tsx scripts/verify-db-objects.ts

      - name: Unit tests
        run: pnpm run test

      - name: Integration tests
        run: pnpm exec vitest run --config vitest.integration.config.mts

      - name: Production build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm run test:e2e
